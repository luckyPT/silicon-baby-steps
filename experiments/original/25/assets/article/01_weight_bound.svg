<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="55" y="68" font-size="36" fill="#5ce0d3">加权启发与质量界限：先交有界次优解</text><text x="65" y="145" font-size="25" fill="#e8f2ff">反向搜索：fε(u)=g(u)+εh(S,u)，ε≥1</text><text x="65" y="210" font-size="25" fill="#e8f2ff">独立例：A的g=10、h=2；B的g=6、h=4</text><text x="65" y="270" font-size="25" fill="#e8f2ff">ε=1：A=12、B=10，优先B；ε=3：A=16、B=18，优先A</text><text x="65" y="360" font-size="25" fill="#e8f2ff">本例最优C*=26；完成ε=3搜索轮次后，C≤78</text><text x="65" y="425" font-size="29" fill="#ffca7a">实际初解C=36；上界78不是实际路径代价预测</text><text x="65" y="515" font-size="25" fill="#e8f2ff">C*由独立Dijkstra事后求得，规划器不提前读入最优答案</text><text x="65" y="625" font-size="23" fill="#a4baca">满足论文假设的图与完成搜索轮次；初解未找到时不凭空交付。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e8f2ff;font-size:25px}.title{font-size:36px;fill:#5ce0d3}.small{font-size:21px;fill:#a4baca}</style><text x="55" y="66" class="title">真实受控序列：复用有收益，也有额外工作</text><text x="60" y="130" class="">阶段                         当前位置     剩余代价      D* Lite扩展 / 重跑A*</text><text x="60" y="183" class="">初始               (1, 7)       20         21 / 21</text><text x="60" y="229" class="">前进7步             (8, 7)       13         0 / 14</text><text x="60" y="275" class="">前方封三格            (8, 7)       17         64 / 71</text><text x="60" y="321" class="">沿绕行线前进2步         (8, 5)       15         0 / 40</text><text x="60" y="367" class="">通道重开             (8, 5)       15         6 / 42</text><text x="60" y="413" class="">整列封闭             (8, 5)       无路         122 / 162</text><text x="60" y="459" class="">只开一扇门            (8, 5)       15         13 / 22</text><text x="60" y="505" class="">软代价升至4           (8, 5)       17         36 / 44</text><text x="60" y="551" class="">软代价降回1           (8, 5)       15         20 / 22</text><text x="60" y="650" class="small">有效扩展不含延迟关键字重入队；封三格另有13次重入队。不是墙钟速度排名。</text></svg>
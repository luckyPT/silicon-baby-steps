<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e8f2ff;font-size:25px}.title{font-size:36px;fill:#5ce0d3}.small{font-size:21px;fill:#a4baca}</style><text x="55" y="66" class="title">D* Lite：从目标反向维护，机器人正向移动</text><text x="65" y="135" class="">g(u)：当前保存的u到目标T的代价估计</text><text x="65" y="190" class="">rhs(T)=0；其他节点 rhs(u)=min[c(u,v)+g(v)]</text><text x="65" y="245" class="">v遍历u的后继；一条有向边u→v改变，先更新rhs(u)</text><text x="65" y="325" class="">g&gt;rhs：接受较低报价，再更新前驱</text><text x="65" y="385" class="">g&lt;rhs：先令g=∞，再更新自身和前驱</text><text x="65" y="480" class="">独立例：V→A花1，g(A)=2；V→B花2，g(B)=3</text><text x="65" y="535" class="">rhs(V)=3；V→A涨价到5后，rhs(V)=min(5+2,2+3)=5</text><text x="65" y="635" class="small">与LPA*的起点代价、前驱递推区分；本例为正权图。</text></svg>
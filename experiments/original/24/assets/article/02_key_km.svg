<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e8f2ff;font-size:25px}.title{font-size:36px;fill:#5ce0d3}.small{font-size:21px;fill:#a4baca}</style><text x="55" y="66" class="title">当前位置移动：km与延迟关键字更新</text><text x="65" y="140" class="">m(u)=min[g(u),rhs(u)]；K(u)=[m(u)+h(S,u)+km, m(u)]</text><text x="65" y="200" class="">每次重新规划：km ← km+h(Slast,S)，再记录Slast ← S</text><text x="65" y="260" class="">取出节点后：若Kold&lt;Knew，按新关键字重新入队</text><text x="65" y="345" class="">独立手算：S=(1,7)→(5,7)，km=0→4，设节点m=10</text><text x="65" y="410" class="">u=(10,7)：第一项 10+9+0=19 → 10+5+4=19</text><text x="65" y="470" class="">u=(0,7)：第一项 10+1+0=11 → 10+5+4=19</text><text x="65" y="560" class="">一致启发保证旧关键字可作下界；不保证关键字都不变</text><text x="65" y="635" class="small">km不是路径代价、行驶时间；地图变化仍需修复g/rhs。</text></svg>
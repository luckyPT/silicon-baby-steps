<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e8f2ff;font-size:25px}.title{font-size:36px;fill:#5ce0d3}.small{font-size:21px;fill:#a4baca}</style><text x="55" y="66" class="title">有限视野导航与验收边界</text><text x="60" y="135" class="">已知地图：周围2格方形范围观察；未知先假设可通行</text><text x="60" y="190" class="">真实地图障碍静止，理想传感无噪声、无遮挡；逐格先观察再走</text><text x="60" y="260" class="">种子7：实际34步到达，35次查询，执行格子未撞障碍</text><text x="60" y="330" class="">3个种子各50次混合更新：移动、封路、重开、软代价变化</text><text x="60" y="390" class="">每次与重跑A*、独立前向Dijkstra核对当前图最短代价</text><text x="60" y="475" class="">当前图最短路 ≠ 未知真实地图的全程最短路</text><text x="60" y="535" class="">当前地图修复 ≠ 行人未来预测或连续时间避碰</text><text x="60" y="635" class="small">有限测试不是通用证明；硬实时还需预算、尾部耗时与超时处理。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="55" y="68" font-size="36" fill="#5ce0d3">AD*：地图版本、可行性与完成界限一起检查</text><text x="65" y="145" font-size="25" fill="#e8f2ff">原图：C=26（已完成ε=1轮次）</text><text x="65" y="205" font-size="25" fill="#e8f2ff">封(11,4)：旧路线失效；新图最优28</text><text x="65" y="265" font-size="29" fill="#ffca7a">修复ε=2.5：C=34；再改善ε=1：C=28</text><text x="65" y="345" font-size="25" fill="#e8f2ff">未完成首轮：没有合格初解，不宣布新界限</text><text x="65" y="405" font-size="25" fill="#e8f2ff">同图改善中断：可保留验证过的旧路线，沿用旧界限</text><text x="65" y="465" font-size="26" fill="#5ce0d3">地图变化后修复中断：旧路线穿封格，不能继续执行</text><text x="65" y="555" font-size="25" fill="#e8f2ff">270次AD*完成查询 + 100次额外ARA*完成查询通过复核</text><text x="65" y="625" font-size="23" fill="#a4baca">扩展预算不是毫秒；停止离散移动不等于验证了真实制动安全。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#071725"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="55" y="68" font-size="36" fill="#5ce0d3">ARA*：保留g，下一轮再处理INCONS</text><text x="65" y="150" font-size="25" fill="#e8f2ff">OPEN：当前候选；CLOSED：本轮已处理</text><text x="65" y="215" font-size="25" fill="#e8f2ff">INCONS：本轮已处理，后来又找到更低报价的节点</text><text x="65" y="290" font-size="25" fill="#e8f2ff">下一轮：OPEN←OPEN∪INCONS，清空INCONS与CLOSED</text><text x="65" y="350" font-size="25" fill="#e8f2ff">降低ε后重排OPEN；保留g和已验证的旧路线</text><text x="65" y="445" font-size="27" fill="#5ce0d3">固定种子34，首轮结束实际留下2个INCONS节点：</text><text x="65" y="510" font-size="30" fill="#ffca7a">[[9, 7], [10, 7]]</text><text x="65" y="625" font-size="23" fill="#a4baca">INCONS不是障碍列表；没有每轮从头初始化代价。</text></g></svg>
